<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
   <link rel="icon" href="assets/img/icon-sipenta.png" sizes="32x32" />
  <script>
    if (localStorage.getItem('sipenta_user')) window.location.replace('pages/dashboard.html');
  </script>
</head>
<body class="login-page">

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="login-layout">

    <!-- LEFT / TOP PANEL -->
    <aside class="login-panel-brand">
      <div class="brand-bg-text">SI</div>
      <div class="login-panel-brand-inner">
        <header class="login-left-header">
          <div class="brand-logo"><i class="bi bi-shield-check-fill"></i></div>
          <h1 class="brand-title-big">SIPENTA</h1>
          <div class="brand-divider"></div>
          <p class="brand-desc">Sistem Informasi<br>Tata Tertib &amp; Pelanggaran Sekolah</p>
        </header>
        <ul class="stat-pills list-unstyled">
          <li>
            <span class="pill-icon"><i class="bi bi-people-fill"></i></span>
            <div><p class="pill-val" id="loginSiswaAktif">0</p><p class="pill-lbl">Siswa Aktif</p></div>
          </li>
          <li>
            <span class="pill-icon pill-red"><i class="bi bi-exclamation-triangle-fill"></i></span>
            <div><p class="pill-val" id="loginPelBulanIni">0</p><p class="pill-lbl">Pelanggaran Bulan Ini</p></div>
          </li>
          <li>
            <span class="pill-icon pill-green"><i class="bi bi-award-fill"></i></span>
            <div><p class="pill-val" id="loginKepatuhan">0%</p><p class="pill-lbl">Tingkat Kepatuhan</p></div>
          </li>
        </ul>
        <footer class="login-left-footer">&copy; 2026</footer>
      </div>
    </aside>

    <!-- RIGHT / BOTTOM PANEL -->
    <section class="login-panel-form">
      <div class="login-panel-form-inner">

        <div class="login-right-header">
          <p class="login-eyebrow" id="loginEyebrow"><i class="bi bi-box-arrow-in-right me-1"></i>Masuk Akun</p>
          <h2 class="login-title" id="loginTitle">Selamat Datang</h2>
          <p class="login-sub" id="loginSub">Masuk untuk melanjutkan ke dashboard SIPENTA</p>
        </div>

        <div class="auth-tab-wrap">
          <button type="button" id="tabLogin" class="auth-tab active" onclick="gantiTab('login')">
            <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
          </button>
          <button type="button" id="tabDaftar" class="auth-tab inactive" onclick="gantiTab('daftar')">
            <i class="bi bi-person-plus-fill me-1"></i>Daftar
          </button>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" novalidate>
          <div class="login-field">
            <label class="login-label">Masuk Sebagai</label>
            <select id="role" class="login-select" required>
              <option value="" disabled selected>— Pilih Peran —</option>
              <option value="admin">Administrator</option>
              <option value="guru">Guru / Wali Kelas</option>
              <option value="bp">Guru BK / BP</option>
              <option value="sp2tk">SP2TK</option>
            </select>
            <div class="field-error" id="loginRoleErr"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Username</label>
            <div class="login-input-wrap">
              <i class="bi bi-person-fill login-input-icon"></i>
              <input type="text" id="userId" class="login-input" placeholder="Masukkan username" required minlength="3" autocomplete="username">
            </div>
            <div class="field-error" id="userIdError"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Kata Sandi</label>
            <div class="login-input-wrap">
              <i class="bi bi-lock-fill login-input-icon"></i>
              <input type="password" id="password" class="login-input" placeholder="Masukkan kata sandi" required minlength="6" autocomplete="current-password">
              <button type="button" class="login-eye" onclick="togglePassword('password','eyeLogin')"><i class="bi bi-eye" id="eyeLogin"></i></button>
            </div>
            <div class="field-error" id="passwordError"></div>
          </div>
          <button type="submit" class="login-btn" id="loginBtn">
            <span id="loginBtnText">Masuk ke Dashboard</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
          <div id="loginAlert" class="alert d-none mt-3"></div>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" novalidate style="display:none;">
          <div class="login-field">
            <label class="login-label">Nama Lengkap</label>
            <div class="login-input-wrap">
              <i class="bi bi-person-fill login-input-icon"></i>
              <input type="text" id="regNama" class="login-input" placeholder="Nama lengkap Anda" required>
            </div>
            <div class="field-error" id="regNamaErr"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Peran</label>
            <select id="regRole" class="login-select" required>
              <option value="" disabled selected>— Pilih Peran —</option>
              <option value="admin">Administrator</option>
              <option value="guru">Guru / Wali Kelas</option>
              <option value="bp">Guru BK / BP</option>
              <option value="sp2tk">SP2TK</option>
            </select>
            <div class="field-error" id="regRoleErr"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Username</label>
            <div class="login-input-wrap">
              <i class="bi bi-at login-input-icon"></i>
              <input type="text" id="regUsername" class="login-input" placeholder="Buat username (min. 3 karakter)" required minlength="3">
            </div>
            <div class="field-error" id="regUsernameErr"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Email <span style="font-size:.72rem;color:#93b4d4;font-weight:400;">(opsional)</span></label>
            <div class="login-input-wrap">
              <i class="bi bi-envelope-fill login-input-icon"></i>
              <input type="email" id="regEmail" class="login-input" placeholder="Email Anda">
            </div>
          </div>
          <div class="login-field">
            <label class="login-label">Kata Sandi</label>
            <div class="login-input-wrap">
              <i class="bi bi-lock-fill login-input-icon"></i>
              <input type="password" id="regPwd" class="login-input" placeholder="Min. 6 karakter" required minlength="6" autocomplete="new-password">
              <button type="button" class="login-eye" onclick="togglePassword('regPwd','eyeReg1')"><i class="bi bi-eye" id="eyeReg1"></i></button>
            </div>
            <div class="field-error" id="regPwdErr"></div>
          </div>
          <div class="login-field">
            <label class="login-label">Konfirmasi Kata Sandi</label>
            <div class="login-input-wrap">
              <i class="bi bi-lock-fill login-input-icon"></i>
              <input type="password" id="regPwd2" class="login-input" placeholder="Ulangi kata sandi" required autocomplete="new-password">
              <button type="button" class="login-eye" onclick="togglePassword('regPwd2','eyeReg2')"><i class="bi bi-eye" id="eyeReg2"></i></button>
            </div>
            <div class="field-error" id="regPwd2Err"></div>
          </div>
          <button type="submit" class="login-btn" id="registerBtn">
            <span id="registerBtnText">Buat Akun</span>
            <span id="registerSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
          <div id="registerAlert" class="alert d-none mt-3"></div>
        </form>

      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/auth.js"></script>
</body>
</html>
